<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B5CE5" />
      <stop offset="100%" stop-color="#052E75" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Shield with Drop Shadow -->
  <g filter="url(#shadow)">
    <path
      d="M256 76 L392 128 C392 272 344 380 256 436 C168 380 120 272 120 128 Z"
      fill="url(#shieldGrad)"
      stroke="#60A5FA"
      stroke-width="8"
      stroke-linejoin="round"
    />
  </g>

  <!-- High-tech Grid / Circuit accents inside Shield -->
  <path
    d="M256 128 L256 390 M170 200 L342 200 M180 280 L332 280"
    stroke="#93C5FD"
    stroke-opacity="0.25"
    stroke-width="4"
    stroke-linecap="round"
  />

  <!-- Padlock Symbol in Shield Center -->
  <g transform="translate(0, 10)">
    <!-- Lock Shackle -->
    <path
      d="M216 220 V184 C216 161.9 233.9 144 256 144 C278.1 144 296 161.9 296 184 V220"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="16"
      stroke-linecap="round"
    />
    <!-- Lock Body -->
    <rect
      x="192"
      y="220"
      width="128"
      height="100"
      rx="24"
      fill="url(#accentGrad)"
      stroke="#FFFFFF"
      stroke-width="6"
    />
    <!-- Keyhole -->
    <circle cx="256" cy="260" r="10" fill="#052E75" />
    <path d="M251 264 L261 264 L264 286 L248 286 Z" fill="#052E75" />
  </g>

  <!-- Integrity Verification Check Badge -->
  <circle cx="370" cy="370" r="44" fill="#10B981" stroke="#FFFFFF" stroke-width="8" />
  <path
    d="M352 370 L365 383 L390 358"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="8"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
